[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "multitap"
version = "0.1.0"
description = "Split-screen multi-instance libretro frontend: one game, up to 8 players"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "PySDL2>=0.9.16",
    "pysdl2-dll>=2.28",
]

[project.optional-dependencies]
# cmake provides ctest for the native unit tests (see README).
dev = ["pytest>=8", "cmake>=3.24"]

[project.scripts]
multitap = "multitap.app:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "native"
cmake.version = ">=3.24"
cmake.build-type = "Release"
# A fixed build dir makes re-installs incremental and gives ctest a stable place to run.
build-dir = "build/{wheel_tag}"
wheel.packages = ["multitap"]
# CMake installs to <prefix>/bin; the prefix is the package, so binaries land in multitap/bin/.
wheel.install-dir = "multitap"

[tool.pytest.ini_options]
testpaths = ["tests"]
