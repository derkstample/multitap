[project]
name = "multitap"
version = "0.1.0"
description = "Split-screen multi-instance libretro frontend: one game, up to 8 players"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "PySDL2>=0.9.16",
    "pysdl2-dll>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
multitap = "multitap.app:main"

[tool.setuptools.packages.find]
include = ["multitap*"]

[tool.setuptools.package-data]
multitap = ["assets/controllers/*", "assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
